<!-- product-card.html — Product card with category badges -->
<div class="card" data-category="tablets">
  <div class="card-image" style="height: 200px; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center;">
    <img src="assets/images/product-placeholder.jpg" alt="Product" style="width: 100%; height: 100%; object-fit: cover;">
  </div>
  <div>
    <div style="margin-bottom: 8px;">
      <span class="badge">Tablets</span>
      <span class="badge" style="margin-left: 8px;">OTC</span>

    <p class="card-text">Short description and key benefits.</p>
    <a href="pages/contact.html" class="card-link">Enquire Now →</a>
  </div>
</div>
